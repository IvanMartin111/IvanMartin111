name: Update profile language statistics

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-profile-languages.yml
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-language-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Generate language statistics
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ env.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: IvanMartin111
          filename: assets/statistics/languages.svg
          output_action: commit
          committer_message: "Update language statistics - [Skip GitHub Action]"
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: chaconlab/AbRaCD,chaconlab/RCD
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          config_timezone: Europe/Madrid

      - name: Explain missing token
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "Set the METRICS_TOKEN repository secret to enable language statistics, including private repositories."
