name: Update profile statistics

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-profile-languages.yml
      - scripts/generate_activity.py
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate language statistics
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: IvanMartin111
          filename: assets/statistics/languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: chaconlab/AbRaCD,chaconlab/RCD
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          extras_css: |
            .items-wrapper > section:first-child { display: none !important; }
            .column > small { display: none !important; }
            .column h3.field { font-size: 1.25rem !important; }
          config_timezone: Europe/Madrid

      - name: Copy generated language statistics
        if: ${{ env.METRICS_TOKEN != '' }}
        run: cp /metrics_renders/assets/statistics/languages.svg assets/statistics/languages.svg

      - name: Generate monthly authored commit chart
        if: ${{ env.METRICS_TOKEN != '' }}
        env:
          METRICS_TOKEN: ${{ env.METRICS_TOKEN }}
        run: python scripts/generate_activity.py

      - name: Commit monthly commit chart
        if: ${{ env.METRICS_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/statistics/activity.svg assets/statistics/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics - [Skip GitHub Action]"
            git pull --rebase origin main
            git push
          fi

      - name: Explain missing token
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "Set the METRICS_TOKEN repository secret to enable language and monthly commit statistics, including private repositories."
