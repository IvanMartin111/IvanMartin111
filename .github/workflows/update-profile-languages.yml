name: Update profile statistics

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-profile-languages.yml
      - scripts/generate_activity.py
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate language statistics
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: IvanMartin111
          filename: assets/statistics/languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: chaconlab/AbRaCD,chaconlab/RCD
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          extras_css: |
            .items-wrapper > section:first-child { display: none !important; }
            .column > small { display: none !important; }
            .items-wrapper > .column { box-sizing: border-box; width: 100%; min-height: 390px; padding: 12px 16px; justify-content: space-between; }
            .column h3.field { align-self: center; justify-content: center; text-align: center; font-size: 30px !important; }
            .column svg.bar { width: 100%; height: 12px; margin: 0; }
            .row.fill-width { width: 100%; flex-direction: column; flex-wrap: nowrap; }
            .field.language.details { box-sizing: border-box; width: 100%; min-height: 56px; margin: 0; padding: 12px 4px; font-size: 26px; }
            .field.language.details .field { font-size: 26px; }
            .field.language.details .field svg { width: 20px; height: 20px; }
            .field.language.details small { font-size: 24px; }
          extras_js: |
            const list = document.querySelector(".row.fill-width");
            if (list) {
              const languages = Array.from(list.querySelectorAll(".field.language.details"));
              const percentage = (item) => Number.parseFloat(item.querySelector("small")?.textContent || "0") || 0;
              languages.sort((a, b) => percentage(b) - percentage(a));
              list.replaceChildren(...languages);
            }
          config_timezone: Europe/Madrid

      - name: Copy generated language statistics
        if: ${{ env.METRICS_TOKEN != '' }}
        run: cp /metrics_renders/assets/statistics/languages.svg assets/statistics/languages.svg

      - name: Generate monthly authored commit chart
        if: ${{ env.METRICS_TOKEN != '' }}
        env:
          METRICS_TOKEN: ${{ env.METRICS_TOKEN }}
        run: python scripts/generate_activity.py

      - name: Commit monthly commit chart
        if: ${{ env.METRICS_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/statistics/activity.svg assets/statistics/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics - [Skip GitHub Action]"
            git pull --rebase origin main
            git push
          fi

      - name: Explain missing token
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "Set the METRICS_TOKEN repository secret to enable language and monthly commit statistics, including private repositories."
